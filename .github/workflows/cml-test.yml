name: CML Model Test

on:
  push:
    branches: [dev-branch]
  pull_request:
    branches: [dev-branch]

jobs:
  model-test:
    runs-on: ubuntu-latest

    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/test_key.json

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up GCP credentials
      run: echo "${{ secrets.GCP_KEY_JSON }}" > $GOOGLE_APPLICATION_CREDENTIALS
    - name: Show file structure
      run: ls -R
    - name: Decode GCP credentials
      run: echo "${{ secrets.GCP_KEY_BASE64 }}" | base64 --decode > test_key.json

    - name: Run model test
      run: python test.py

    - name: Post CML report
      uses: iterative/setup-cml@v2.0.1
      with:
        markdown: report.md
    - name: Post README.md as comment
      run: |
        cml comment create README.md
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create PR to main if it doesn't exist
      run: |
        gh pr list --base main --head dev-branch | grep -q . || \
        gh pr create --base main --head dev-branch --title "Auto PR: Merge dev-branch → main" --body "Model test passed. Automatically opening pull request to merge dev-branch into main."
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
